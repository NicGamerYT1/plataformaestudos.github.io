<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Plataforma de Estudos</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #0f2f8f 0%, #165DFF 50%, #36BFFA 100%);
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 2rem 1rem;
    }
    .wrapper { width: 100%; max-width: 420px; }

    .logo-area { text-align: center; margin-bottom: 1.5rem; }
    .logo-icon { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background: rgba(255,255,255,0.2); border-radius: 16px; margin-bottom: 0.75rem; }
    .logo-icon i { color: #fff; font-size: 2rem; }
    .logo-title { color: #fff; font-size: 1.5rem; font-weight: 900; }
    .logo-sub { color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-top: 0.25rem; }

    .card { background: #fff; border-radius: 24px; padding: 2rem; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: fadeUp 0.5s ease both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }

    .card-title { font-size: 1.5rem; font-weight: 900; color: #1D2129; margin-bottom: 0.25rem; }
    .card-sub { font-size: 0.85rem; color: #9ca3af; margin-bottom: 1.5rem; }

    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: #4b5563; margin-bottom: 0.4rem; }
    .input-wrap { position: relative; }
    .input-wrap .icone { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 0.85rem; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; padding: 0.75rem 1rem 0.75rem 2.75rem;
      border: 2px solid #e5e7eb; border-radius: 12px;
      font-family: 'Nunito', sans-serif; font-size: 0.9rem; font-weight: 600;
      color: #1D2129; background: #fafafa; transition: all 0.2s;
    }
    input:focus { border-color: #165DFF; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(22,93,255,0.12); }
    input::placeholder { color: #9ca3af; font-weight: 500; }
    .toggle-senha { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #9ca3af; font-size: 0.9rem; }
    .toggle-senha:hover { color: #4b5563; }

    .btn-primary { width: 100%; padding: 0.9rem; background: #165DFF; color: #fff; border: none; border-radius: 12px; font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 900; cursor: pointer; transition: background 0.2s; box-shadow: 0 6px 20px rgba(22,93,255,0.3); margin-top: 0.5rem; }
    .btn-primary:hover { background: #1347cc; }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

    .alert { display: none; border-radius: 12px; padding: 0.75rem 1rem; font-size: 0.85rem; font-weight: 700; margin-bottom: 1rem; align-items: center; gap: 0.5rem; }
    .alert.show { display: flex; }
    .alert-erro { background: #fff1f0; border: 1px solid #ffccc7; color: #F53F3F; }
    .alert-ok   { background: #f6ffed; border: 1px solid #b7eb8f; color: #00B42A; }

    .divisor { border-top: 1px solid #f3f4f6; margin: 1.25rem 0; }
    .link-area { text-align: center; font-size: 0.85rem; color: #9ca3af; }
    .link-area a { color: #165DFF; font-weight: 900; text-decoration: none; margin-left: 4px; }
    .link-area a:hover { text-decoration: underline; }

    .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-txt { color: rgba(255,255,255,0.5); font-size: 0.75rem; text-align: center; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="wrapper">

  <div class="logo-area">
    <div class="logo-icon"><i class="fa fa-graduation-cap"></i></div>
    <div class="logo-title">Plataforma de Estudos</div>
    <div class="logo-sub">Faça login para continuar estudando</div>
  </div>

  <div class="card">
    <div class="card-title">Bem-vindo de volta!</div>
    <div class="card-sub">Entre com seu e-mail e senha</div>

    <div id="alertaErro" class="alert alert-erro"><i class="fa fa-exclamation-circle"></i><span id="alertaErroTxt"></span></div>
    <div id="alertaOk" class="alert alert-ok"><i class="fa fa-check-circle"></i><span>Conta criada com sucesso! Faça seu login.</span></div>

    <div class="field">
      <label for="email">E-mail</label>
      <div class="input-wrap">
        <i class="fa fa-envelope icone"></i>
        <input type="email" id="email" placeholder="seuemail@exemplo.com">
      </div>
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <div class="input-wrap">
        <i class="fa fa-lock icone"></i>
        <input type="password" id="senha" placeholder="Digite sua senha" onkeydown="if(event.key==='Enter')fazerLogin()">
        <button class="toggle-senha" type="button" onclick="toggleSenha()"><i id="olho" class="fa fa-eye-slash"></i></button>
      </div>
    </div>

    <button id="btnEntrar" class="btn-primary" onclick="fazerLogin()">
      <i class="fa fa-sign-in"></i> Entrar
    </button>

    <div class="divisor"></div>
    <div class="link-area">Ainda não tem conta? <a href="cadastro.html">Criar conta grátis</a></div>
  </div>

  <div class="footer-txt">&copy; 2024 Plataforma de Estudos</div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    if (new URLSearchParams(window.location.search).get('cadastro') === 'ok') {
      document.getElementById('alertaOk').classList.add('show');
    }
  });

  function toggleSenha() {
    const c = document.getElementById('senha');
    const i = document.getElementById('olho');
    c.type = c.type === 'password' ? 'text' : 'password';
    i.className = c.type === 'password' ? 'fa fa-eye-slash' : 'fa fa-eye';
  }

  function fazerLogin() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const senha = document.getElementById('senha').value;
    const btn   = document.getElementById('btnEntrar');

    document.getElementById('alertaErro').classList.remove('show');

    if (!email || !senha) {
      mostrarErro('Preencha e-mail e senha.');
      return;
    }

    const lista = JSON.parse(localStorage.getItem('listaUsuarios')) || [];
    const usuario = lista.find(u => u.email === email && u.senha === senha);

    if (!usuario) {
      mostrarErro('E-mail ou senha incorretos. Tente novamente.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Entrando...';

    localStorage.setItem('usuarioLogado', JSON.stringify(usuario));

    setTimeout(() => { window.location.href = 'inicio.html'; }, 600);
  }

  function mostrarErro(msg) {
    document.getElementById('alertaErroTxt').textContent = msg;
    document.getElementById('alertaErro').classList.add('show');
  }
</script>
</body>
</html>
