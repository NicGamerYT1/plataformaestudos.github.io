<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Plataforma de Estudos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primario: '#165DFF',
                        secundario: '#36BFFA',
                        sucesso: '#00B42A',
                        aviso: '#FF7D00',
                        erro: '#F53F3F',
                        claro: '#F7F8FA',
                        escuro: '#1D2129',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .conteudo-sombra {
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            }
            .botao-efeito {
                transition: all 0.3s ease;
            }
            .botao-efeito:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(22, 93, 255, 0.3);
            }
            .input-estilo {
                transition: all 0.2s ease;
            }
            .input-estilo:focus {
                border-color: #165DFF;
                outline: none;
                box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.2);
            }
        }
    </style>
</head>
<body class="bg-claro min-h-screen font-sans text-escuro">
    <!-- Cabeçalho -->
    <header class="bg-primario text-white py-6 px-4">
        <div class="max-w-6xl mx-auto flex items-center gap-3">
            <i class="fa fa-graduation-cap text-3xl"></i>
            <h1 class="text-2xl font-bold">Plataforma de Estudos</h1>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-2xl mx-auto py-16 px-4">
        <div class="bg-white rounded-2xl p-8 conteudo-sombra">
            <div class="text-center mb-8">
                <h2 class="text-[clamp(1.8rem,4vw,2.2rem)] font-bold mb-2">Criar Nova Conta</h2>
                <p class="text-gray-600">Preencha todos os dados abaixo para começar a usar a plataforma</p>
            </div>

            <!-- Formulário de Cadastro -->
            <form id="formCadastro" class="space-y-6">
                <!-- Nome Completo -->
                <div>
                    <label for="nome" class="block text-gray-700 font-medium mb-2">Nome Completo</label>
                    <input 
                        type="text" 
                        id="nome" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-estilo"
                        placeholder="Digite seu nome completo"
                        required
                    >
                </div>

                <!-- Data de Nascimento -->
                <div>
                    <label for="nascimento" class="block text-gray-700 font-medium mb-2">Data de Nascimento</label>
                    <input 
                        type="date" 
                        id="nascimento" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-estilo"
                        required
                    >
                </div>

                <!-- E-mail -->
                <div>
                    <label for="email" class="block text-gray-700 font-medium mb-2">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-estilo"
                        placeholder="seuemail@exemplo.com"
                        required
                    >
                </div>

                <!-- Telefone -->
                <div>
                    <label for="telefone" class="block text-gray-700 font-medium mb-2">Telefone para Contato</label>
                    <input 
                        type="tel" 
                        id="telefone" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-estilo"
                        placeholder="(00) 00000-0000"
                        required
                    >
                </div>

                <!-- Série / Ano -->
                <div>
                    <label for="serie" class="block text-gray-700 font-medium mb-2">Série / Ano que estuda</label>
                    <select 
                        id="serie" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-estilo"
                        required
                    >
                        <option value="">Selecione a série</option>
                        <option value="5ano">5º Ano do Ensino Fundamental</option>
                        <option value="6ano">6º Ano do Ensino Fundamental</option>
                        <option value="7ano">7º Ano do Ensino Fundamental</option>
                        <option value="8ano">8º Ano do Ensino Fundamental</option>
                        <option value="9ano">9º Ano do Ensino Fundamental</option>
                        <option value="1medio">1º Ano do Ensino Médio</option>
                        <option value="2medio">2º Ano do Ensino Médio</option>
                        <option value="3medio">3º Ano do Ensino Médio</option>
                    </select>
                </div>

                <!-- Escola -->
                <div>
                    <label for="escola" class="block text-gray-700 font-medium mb-2">Nome da Escola</label>
                    <input 
                        type="text" 
                        id="escola" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-estilo"
                        placeholder="Digite o nome da sua escola"
                        required
                    >
                </div>

                <!-- Senha -->
                <div>
                    <label for="senha" class="block text-gray-700 font-medium mb-2">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-estilo"
                        placeholder="Digite sua senha (mínimo 6 caracteres)"
                        minlength="6"
                        required
                    >
                </div>

                <!-- Confirmar Senha -->
                <div>
                    <label for="confirmarSenha" class="block text-gray-700 font-medium mb-2">Confirmar Senha</label>
                    <input 
                        type="password" 
                        id="confirmarSenha" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-estilo"
                        placeholder="Digite novamente sua senha"
                        minlength="6"
                        required
                    >
                    <p id="erroSenha" class="text-erro text-sm mt-1 hidden">As senhas não são iguais!</p>
                </div>

                <!-- Tipo de Usuário -->
                <div>
                    <label class="block text-gray-700 font-medium mb-2">Tipo de Usuário</label>
                    <div class="flex gap-4 flex-wrap">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="tipoUsuario" value="aluno" class="w-4 h-4 text-primario" checked>
                            <span>Aluno</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="tipoUsuario" value="responsavel" class="w-4 h-4 text-primario">
                            <span>Responsável / Pai</span>
                        </label>
                    </div>
                </div>

                <!-- Botão de Cadastro -->
                <button 
                    type="submit"
                    class="w-full bg-primario text-white py-3 px-4 rounded-lg font-medium botao-efeito hover:bg-primario/90"
                >
                    Cadastrar e Acessar
                </button>
            </form>

            <!-- Link para login -->
            <div class="text-center mt-6 pt-6 border-t border-gray-200">
                <p class="text-gray-600">Já tem uma conta? 
                    <a href="login.html" class="text-primario font-medium hover:underline">Fazer login</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-escuro text-white py-6 px-4 mt-16">
        <div class="max-w-6xl mx-auto text-center">
            <p>&copy; 2024 Plataforma de Estudos. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        // Quando o formulário for enviado
        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault();

            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            // Verifica se as senhas são iguais
            if (senha !== confirmarSenha) {
                document.getElementById('erroSenha').classList.remove('hidden');
                return;
            } else {
                document.getElementById('erroSenha').classList.add('hidden');
            }

            // Pegar os dados do formulário
            const dadosUsuario = {
                nome: document.getElementById('nome').value,
                nascimento: document.getElementById('nascimento').value,
                email: document.getElementById('email').value,
                telefone: document.getElementById('telefone').value,
                serie: document.getElementById('serie').value,
                escola: document.getElementById('escola').value,
                senha: senha,
                tipo: document.querySelector('input[name="tipoUsuario"]:checked').value,
                logado: true
            };

            // Salvar os dados no navegador
            localStorage.setItem('usuarioLogado', JSON.stringify(dadosUsuario));

            // Redirecionar para a página inicial
            window.location.href = 'inicio.html';
        });
    </script>
</body>
</html>
