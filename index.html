<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Plataforma de Estudos</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        .caixa-cadastro {
            max-width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .campo-formulario {
            margin-bottom: 20px;
        }
        .campo-formulario label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }
        .campo-formulario input, .campo-formulario select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .botao-cadastrar {
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .botao-cadastrar:hover {
            background-color: #219653;
        }
        .mensagem-sucesso {
            text-align: center;
            padding: 20px;
            color: #27ae60;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
        /* Estilo do botão de voltar */
        .botao-voltar {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px 0;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .botao-voltar:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <main>
        <div class="caixa-cadastro">
            <!-- Botão de voltar que funciona -->
            <button class="botao-voltar" onclick="voltarPagina()">⬅ Voltar</button>

            <h1 style="text-align: center; color: #2c3e50; margin-bottom: 30px;">Cadastre-se para acessar</h1>
            
            <div class="mensagem-sucesso" id="mensagemSucesso">
                ✅ Cadastro realizado com sucesso! Você já pode acessar o conteúdo.
            </div>

            <form id="formCadastro" onsubmit="realizarCadastro(event)">
                <div class="campo-formulario">
                    <label>Tipo de usuário:</label>
                    <select id="tipoUsuario" required>
                        <option value="">Escolha uma opção</option>
                        <option value="aluno">Aluno</option>
                        <option value="responsavel">Pai/Mãe/Responsável</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label>Nome completo:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="campo-formulario">
                    <label>Nome da escola:</label>
                    <input type="text" value="Escola Exemplo" readonly>
                </div>

                <div class="campo-formulario">
                    <label>Série/Ano:</label>
                    <input type="text" value="8º Ano" readonly>
                </div>

                <div class="campo-formulario">
                    <label>E-mail:</label>
                    <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo-formulario">
                    <label>Telefone para contato:</label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                </div>

                <div class="campo-formulario">
                    <label>Valor do acesso: R$ 10,00 por ano</label>
                </div>

                <button type="submit" class="botao-cadastrar">Concluir Cadastro e Acessar</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
