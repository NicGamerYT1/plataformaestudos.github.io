<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plataforma de Estudos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primario: '#165DFF',
                        secundario: '#36BFFA',
                        sucesso: '#00B42A',
                        aviso: '#FF7D00',
                        erro: '#F53F3F',
                        claro: '#F7F8FA',
                        escuro: '#1D2129',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .conteudo-sombra {
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            }
            .botao-efeito {
                transition: all 0.3s ease;
            }
            .botao-efeito:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(22, 93, 255, 0.3);
            }
            .input-estilo {
                transition: all 0.2s ease;
            }
            .input-estilo:focus {
                border-color: #165DFF;
                outline: none;
                box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.2);
            }
        }
    </style>
</head>
<body class="bg-claro min-h-screen font-sans text-escuro">
    <!-- Cabeçalho -->
    <header class="bg-primario text-white py-6 px-4">
        <div class="max-w-6xl mx-auto flex items-center gap-3">
            <i class="fa fa-graduation-cap text-3xl"></i>
            <h1 class="text-2xl font-bold">Plataforma de Estudos</h1>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-2xl mx-auto py-16 px-4">
        <div class="bg-white rounded-2xl p-8 conteudo-sombra">
            <div class="text-center mb-8">
                <h2 class="text-[clamp(1.8rem,4vw,2.2rem)] font-bold mb-2">Entrar na Conta</h2>
                <p class="text-gray-600">Digite seus dados para acessar sua conta</p>
            </div>

            <!-- Formulário de Login -->
            <form id="formLogin" class="space-y-6">
                <!-- E-mail -->
                <div>
                    <label for="email" class="block text-gray-700 font-medium mb-2">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-estilo"
                        placeholder="seuemail@exemplo.com"
                        required
                    >
                </div>

                <!-- Senha -->
                <div>
                    <label for="senha" class="block text-gray-700 font-medium mb-2">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg input-estilo"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <!-- Botão de Login -->
                <button 
                    type="submit"
                    class="w-full bg-primario text-white py-3 px-4 rounded-lg font-medium botao-efeito hover:bg-primario/90"
                >
                    Entrar
                </button>
            </form>

            <!-- Link para cadastro -->
            <div class="text-center mt-6 pt-6 border-t border-gray-200">
                <p class="text-gray-600">Não tem uma conta? 
                    <a href="cadastro.html" class="text-primario font-medium hover:underline">Cadastre-se agora</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-escuro text-white py-6 px-4 mt-16">
        <div class="max-w-6xl mx-auto text-center">
            <p>&copy; 2024 Plataforma de Estudos. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        // Quando o formulário de login for enviado
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();

            const emailDigitado = document.getElementById('email').value;
            const senhaDigitada = document.getElementById('senha').value;

            // Pegar os dados salvos
            const usuarioSalvo = localStorage.getItem('usuarioLogado');

            if (usuarioSalvo) {
                const dadosUsuario = JSON.parse(usuarioSalvo);

                // Verificar se os dados estão corretos
                if (dadosUsuario.email === emailDigitado && dadosUsuario.senha === senhaDigitada) {
                    dadosUsuario.logado = true;
                    localStorage.setItem('usuarioLogado', JSON.stringify(dadosUsuario));
                    window.location.href = 'inicio.html';
                } else {
                    alert('E-mail ou senha incorretos!');
                }
            } else {
                alert('Nenhum usuário cadastrado. Faça o cadastro primeiro!');
                window.location.href = 'cadastro.html';
            }
        });
    </script>
</body>
</html>
