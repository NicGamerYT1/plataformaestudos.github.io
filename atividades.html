<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividades - Plataforma de Estudos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="acesso.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primario:'#165DFF',secundario:'#36BFFA',sucesso:'#00B42A',aviso:'#FF7D00',erro:'#F53F3F',claro:'#F7F8FA',escuro:'#1D2129',
        },
        fontFamily: { sans: ['Nunito', 'system-ui', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  *{box-sizing:border-box;}body{background:#F0F4FF;}
  .conteudo-sombra{box-shadow:0 4px 24px rgba(22,93,255,0.07);}
  .botao-efeito{transition:all 0.3s ease;}.botao-efeito:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(22,93,255,0.25);}
  .menu-lateral{transition:transform 0.3s cubic-bezier(.4,0,.2,1);}
  #modalAtividade{transition:opacity 0.2s ease;}
  .opcao-questao{border:2px solid #e5e7eb;border-radius:0.75rem;padding:0.875rem 1rem;cursor:pointer;transition:all 0.2s;font-weight:600;font-size:0.9rem;display:flex;align-items:center;gap:0.75rem;}
  .opcao-questao:hover{border-color:#165DFF;background:#eff4ff;}
  .opcao-questao.selecionada{border-color:#165DFF;background:#eff4ff;color:#165DFF;}
  .opcao-questao.correta{border-color:#00B42A;background:#f0fdf4;color:#00B42A;}
  .opcao-questao.errada{border-color:#F53F3F;background:#fff1f1;color:#F53F3F;}
  .letra-opcao{width:2rem;height:2rem;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.8rem;flex-shrink:0;transition:all 0.2s;}
  .selecionada .letra-opcao{background:#165DFF;color:white;}.correta .letra-opcao{background:#00B42A;color:white;}.errada .letra-opcao{background:#F53F3F;color:white;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}.anim{animation:fadeUp 0.4s ease both;}
</style>
</head>
<body class="min-h-screen font-sans text-escuro flex">

<header class="fixed top-0 left-0 right-0 bg-primario text-white py-4 px-4 z-20 shadow-lg">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button class="md:hidden text-white text-xl p-1" onclick="toggleMenu()"><i class="fa fa-bars"></i></button>
      <i class="fa fa-graduation-cap text-2xl"></i>
      <h1 class="text-lg md:text-xl font-bold">Plataforma de Estudos</h1>
    </div>
    <div class="flex items-center gap-3">
      <span id="nomeUsuario" class="font-semibold text-sm hidden sm:inline"></span>
      <button onclick="sairDaConta()" class="bg-white text-primario px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-50 transition-colors">Sair</button>
    </div>
  </div>
</header>

<aside id="menuLateral" class="menu-lateral fixed top-16 left-0 w-64 h-[calc(100vh-4rem)] bg-white border-r border-gray-100 pt-6 z-30 overflow-y-auto -translate-x-full md:translate-x-0 shadow-xl md:shadow-none">
  <nav class="px-4"><ul class="space-y-1">
    <li><a href="inicio.html"     class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-primario/10 transition-colors text-gray-600 hover:text-primario font-semibold text-sm"><i class="fa fa-home w-5 text-center"></i> Início</a></li>
    <li><a href="materias.html"   class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-primario/10 transition-colors text-gray-600 hover:text-primario font-semibold text-sm"><i class="fa fa-book w-5 text-center"></i> Matérias</a></li>
    <li><a href="atividades.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primario/10 text-primario font-bold text-sm"><i class="fa fa-tasks w-5 text-center"></i> Atividades</a></li>
    <li><a href="desempenho.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-primario/10 transition-colors text-gray-600 hover:text-primario font-semibold text-sm"><i class="fa fa-bar-chart w-5 text-center"></i> Meu Desempenho</a></li>
    <li><a href="assinatura.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-primario/10 transition-colors text-gray-600 hover:text-primario font-semibold text-sm"><i class="fa fa-credit-card w-5 text-center"></i> Assinatura</a></li>
    <li><a href="perfil.html"     class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-primario/10 transition-colors text-gray-600 hover:text-primario font-semibold text-sm"><i class="fa fa-user w-5 text-center"></i> Perfil</a></li>
    <li><a href="pais.html"       class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-primario/10 transition-colors text-gray-600 hover:text-primario font-semibold text-sm"><i class="fa fa-users w-5 text-center"></i> Pais / Responsáveis</a></li>
  </ul></nav>
</aside>
<div id="fundoMenu" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden" onclick="toggleMenu()"></div>

<main class="w-full md:ml-64 mt-16 pb-16 px-3 sm:px-6 pt-8">
  <div class="mb-6 anim"><h2 class="text-2xl sm:text-3xl font-black mb-1">Atividades de Estudo</h2><p class="text-gray-500 text-sm">Resolva exercícios, teste seus conhecimentos e acompanhe seu progresso.</p></div>

  <div class="bg-white rounded-2xl p-4 sm:p-6 conteudo-sombra mb-8 anim">
    <h3 class="font-bold text-base mb-4 flex items-center gap-2"><i class="fa fa-filter text-primario"></i> Filtrar Atividades</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div><label class="block text-gray-700 font-bold mb-1.5 text-xs uppercase tracking-wide">Matéria</label>
        <select id="filtroMateria" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primario bg-gray-50">
          <option value="">Todas as matérias</option><option value="matematica">Matemática</option><option value="portugues">Língua Portuguesa</option><option value="ciencias">Ciências</option><option value="historia">História</option><option value="geografia">Geografia</option><option value="ingles">Inglês</option>
        </select></div>
      <div><label class="block text-gray-700 font-bold mb-1.5 text-xs uppercase tracking-wide">Série / Ano</label>
        <select id="filtroSerie" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primario bg-gray-50">
          <option value="">Todas as séries</option><option value="5ano">5º Ano</option><option value="6ano">6º Ano</option><option value="7ano">7º Ano</option><option value="8ano">8º Ano</option><option value="9ano">9º Ano</option>
        </select></div>
      <div><label class="block text-gray-700 font-bold mb-1.5 text-xs uppercase tracking-wide">Dificuldade</label>
        <select id="filtroDificuldade" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-primario bg-gray-50">
          <option value="">Todas</option><option value="facil">Fácil</option><option value="medio">Médio</option><option value="dificil">Difícil</option>
        </select></div>
      <div class="flex items-end"><button onclick="filtrarAtividades()" class="w-full bg-primario text-white py-2.5 px-4 rounded-xl font-bold botao-efeito text-sm"><i class="fa fa-search mr-1"></i> Filtrar</button></div>
    </div>
  </div>

  <p id="contadorResultados" class="text-sm text-gray-500 font-semibold mb-4"></p>
  <div id="listaAtividades" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-5"></div>
  <div id="semResultados" class="hidden text-center py-16"><i class="fa fa-search text-5xl text-gray-300 mb-4 block"></i><p class="text-gray-500 font-bold text-lg">Nenhuma atividade encontrada</p><p class="text-gray-400 text-sm mt-1">Tente outros filtros</p></div>
</main>

<!-- Modal Atividade -->
<div id="modalAtividade" class="fixed inset-0 bg-black/60 z-50 hidden flex items-start justify-center p-3 sm:p-6 overflow-y-auto">
  <div class="bg-white rounded-2xl w-full max-w-2xl my-4 overflow-hidden shadow-2xl">
    <div id="modalHeader" class="p-5 text-white">
      <div class="flex items-start justify-between">
        <div><p id="modalMateria" class="text-xs font-bold uppercase tracking-widest opacity-80 mb-1"></p><h3 id="modalTitulo" class="text-xl font-black leading-tight"></h3><p id="modalInfo" class="text-sm opacity-80 mt-1"></p></div>
        <button onclick="fecharModal()" class="text-white/70 hover:text-white text-2xl ml-4 flex-shrink-0 leading-none">&times;</button>
      </div>
      <div class="mt-4 bg-white/20 rounded-full h-2"><div id="barraProgresso" class="bg-white rounded-full h-2 transition-all duration-500" style="width:0%"></div></div>
      <p id="progressoTexto" class="text-xs opacity-70 mt-1 text-right"></p>
    </div>
    <div id="corpoModal" class="p-5 sm:p-6">
      <p id="enunciadoQuestao" class="text-base font-bold text-escuro mb-5 leading-relaxed"></p>
      <div id="opcoesQuestao" class="space-y-3"></div>
      <div id="feedbackQuestao" class="hidden mt-4 p-4 rounded-xl text-sm font-semibold"></div>
    </div>
    <div class="px-5 pb-5 sm:px-6 sm:pb-6 flex justify-between items-center gap-3">
      <div id="placarModal" class="text-sm font-bold text-gray-500"></div>
      <button id="btnProximo" onclick="proximaQuestao()" class="bg-primario text-white px-6 py-2.5 rounded-xl font-bold botao-efeito text-sm hidden">Próxima <i class="fa fa-arrow-right ml-1"></i></button>
    </div>
  </div>
</div>

<!-- Modal Resultado -->
<div id="modalResultado" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-md p-8 text-center shadow-2xl">
    <div id="iconResultado" class="text-6xl mb-4"></div>
    <h3 id="tituloResultado" class="text-2xl font-black mb-2"></h3>
    <p id="subtituloResultado" class="text-gray-500 mb-6"></p>
    <div class="flex gap-3 justify-center flex-wrap">
      <button onclick="reiniciarAtividade()" class="bg-primario text-white px-6 py-2.5 rounded-xl font-bold botao-efeito text-sm"><i class="fa fa-refresh mr-1"></i> Tentar Novamente</button>
      <button onclick="fecharTudo()" class="bg-gray-100 text-gray-700 px-6 py-2.5 rounded-xl font-bold hover:bg-gray-200 transition-colors text-sm">Fechar</button>
    </div>
  </div>
</div>

<script>
const atividades = [
  {id:1,titulo:'Operações Básicas',materia:'matematica',materiaLabel:'Matemática',serie:'5ano',dificuldade:'facil',cor:'#3B82F6',descricao:'Exercícios de adição, subtração, multiplicação e divisão.',questoes:[{enunciado:'Quanto é 48 + 37?',opcoes:['75','85','95','65'],correta:1},{enunciado:'Quanto é 120 - 45?',opcoes:['65','75','85','95'],correta:1},{enunciado:'Quanto é 7 × 8?',opcoes:['54','56','58','48'],correta:1},{enunciado:'Quanto é 144 ÷ 12?',opcoes:['10','11','12','13'],correta:2},{enunciado:'Qual é o dobro de 35?',opcoes:['60','65','70','75'],correta:2}]},
  {id:2,titulo:'Interpretação de Texto',materia:'portugues',materiaLabel:'Português',serie:'6ano',dificuldade:'medio',cor:'#EF4444',descricao:'Leia os textos e responda perguntas sobre conteúdo e interpretação.',questoes:[{enunciado:'O que é um substantivo?',opcoes:['Palavra que indica ação','Palavra que dá nome aos seres','Palavra que modifica o verbo','Palavra que une orações'],correta:1},{enunciado:'Qual é o plural de "cidadão"?',opcoes:['cidadãos','cidadões','cidadõis','cidadãis'],correta:0},{enunciado:'Qual classe gramatical pertence a palavra "rapidamente"?',opcoes:['Adjetivo','Substantivo','Advérbio','Pronome'],correta:2},{enunciado:'Em "O gato subiu no telhado", qual é o sujeito?',opcoes:['subiu','no telhado','O gato','telhado'],correta:2},{enunciado:'Qual é o sinônimo de "feliz"?',opcoes:['Triste','Contente','Irritado','Cansado'],correta:1}]},
  {id:3,titulo:'Corpo Humano',materia:'ciencias',materiaLabel:'Ciências',serie:'7ano',dificuldade:'medio',cor:'#22C55E',descricao:'Estude os sistemas do corpo humano e suas funções principais.',questoes:[{enunciado:'Qual órgão é responsável pelo bombeamento do sangue?',opcoes:['Pulmão','Rim','Coração','Fígado'],correta:2},{enunciado:'Qual sistema é responsável pela troca de gases no corpo?',opcoes:['Digestório','Respiratório','Circulatório','Nervoso'],correta:1},{enunciado:'Onde ocorre a digestão dos alimentos?',opcoes:['Coração','Pulmão','Cérebro','Sistema digestório'],correta:3},{enunciado:'Qual é a função dos rins?',opcoes:['Produzir sangue','Filtrar o sangue e produzir urina','Realizar trocas gasosas','Controlar o corpo'],correta:1},{enunciado:'Quantos ossos tem o corpo humano adulto aproximadamente?',opcoes:['106','206','306','406'],correta:1}]},
  {id:4,titulo:'Períodos Históricos',materia:'historia',materiaLabel:'História',serie:'8ano',dificuldade:'dificil',cor:'#F59E0B',descricao:'Conheça as principais fases da história e seus acontecimentos.',questoes:[{enunciado:'Em que ano o Brasil foi descoberto pelos portugueses?',opcoes:['1498','1500','1502','1492'],correta:1},{enunciado:'Quem proclamou a Independência do Brasil?',opcoes:['Dom João VI','Tiradentes','Dom Pedro I','Getúlio Vargas'],correta:2},{enunciado:'Em que ano ocorreu a Proclamação da República no Brasil?',opcoes:['1888','1889','1890','1891'],correta:1},{enunciado:'Qual movimento buscava a independência do Brasil no século XVIII?',opcoes:['Revolução Farroupilha','Conjuração Baiana','Inconfidência Mineira','Cabanagem'],correta:2},{enunciado:'Qual foi o primeiro presidente do Brasil?',opcoes:['Floriano Peixoto','Getúlio Vargas','Deodoro da Fonseca','Campos Sales'],correta:2}]},
  {id:5,titulo:'Regiões do Brasil',materia:'geografia',materiaLabel:'Geografia',serie:'6ano',dificuldade:'facil',cor:'#10B981',descricao:'Características, climas, vegetação e economia das regiões brasileiras.',questoes:[{enunciado:'Quantas regiões tem o Brasil?',opcoes:['3','4','5','6'],correta:2},{enunciado:'Qual é a maior região do Brasil em extensão territorial?',opcoes:['Sudeste','Sul','Nordeste','Norte'],correta:3},{enunciado:'Qual é a capital do Brasil?',opcoes:['São Paulo','Rio de Janeiro','Brasília','Salvador'],correta:2},{enunciado:'Qual região é conhecida como o "celeiro do Brasil"?',opcoes:['Norte','Nordeste','Centro-Oeste','Sul'],correta:3},{enunciado:'O bioma Cerrado está presente principalmente em qual região?',opcoes:['Norte','Sul','Centro-Oeste','Sudeste'],correta:2}]},
  {id:6,titulo:'Vocabulário em Inglês',materia:'ingles',materiaLabel:'Inglês',serie:'5ano',dificuldade:'facil',cor:'#8B5CF6',descricao:'Aprenda palavras e expressões básicas em inglês.',questoes:[{enunciado:'Como se diz "cachorro" em inglês?',opcoes:['Cat','Bird','Dog','Fish'],correta:2},{enunciado:'O que significa "Hello"?',opcoes:['Tchau','Obrigado','Olá','Por favor'],correta:2},{enunciado:'Como se diz "escola" em inglês?',opcoes:['House','School','Book','Table'],correta:1},{enunciado:'O que significa "I am happy"?',opcoes:['Estou com fome','Estou feliz','Estou cansado','Estou com frio'],correta:1},{enunciado:'Como se diz "vermelho" em inglês?',opcoes:['Blue','Green','Yellow','Red'],correta:3}]},
  {id:7,titulo:'Frações e Decimais',materia:'matematica',materiaLabel:'Matemática',serie:'6ano',dificuldade:'medio',cor:'#3B82F6',descricao:'Operações com frações, números decimais e porcentagem.',questoes:[{enunciado:'Quanto é 1/2 + 1/4?',opcoes:['2/6','3/4','1/3','2/4'],correta:1},{enunciado:'Quanto é 0,5 + 0,25?',opcoes:['0,70','0,75','0,80','0,85'],correta:1},{enunciado:'Qual é a fração equivalente a 0,25?',opcoes:['1/5','1/3','1/4','1/2'],correta:2},{enunciado:'50% de 200 é igual a?',opcoes:['50','75','100','150'],correta:2},{enunciado:'Quanto é 3/4 de 80?',opcoes:['40','50','60','70'],correta:2}]},
  {id:8,titulo:'Ortografia e Gramática',materia:'portugues',materiaLabel:'Português',serie:'5ano',dificuldade:'facil',cor:'#EF4444',descricao:'Regras de escrita, acentuação e uso correto da língua portuguesa.',questoes:[{enunciado:'Qual a grafia correta?',opcoes:['Excessão','Exeção','Exceção','Execeção'],correta:2},{enunciado:'Qual palavra está acentuada corretamente?',opcoes:['Voce','Você','Vocé','Vôce'],correta:1},{enunciado:'Qual é o plural de "cidadão"?',opcoes:['Cidadões','Cidadãos','Cidadõis','Cidadeis'],correta:1},{enunciado:'Qual alternativa usa a vírgula corretamente?',opcoes:['João, foi ao mercado','Maria comprou pão, leite e ovos','Ele correu, rápido','A casa, é bonita'],correta:1},{enunciado:'Qual é o antônimo de "generoso"?',opcoes:['Bondoso','Gentil','Mesquinho','Amável'],correta:2}]},
  {id:9,titulo:'Sistema Solar',materia:'ciencias',materiaLabel:'Ciências',serie:'6ano',dificuldade:'facil',cor:'#22C55E',descricao:'Planetas, estrelas e os principais elementos do sistema solar.',questoes:[{enunciado:'Quantos planetas tem o Sistema Solar?',opcoes:['7','8','9','10'],correta:1},{enunciado:'Qual é o maior planeta do Sistema Solar?',opcoes:['Saturno','Netuno','Júpiter','Urano'],correta:2},{enunciado:'Qual planeta é conhecido como o "planeta vermelho"?',opcoes:['Vênus','Mercúrio','Marte','Júpiter'],correta:2},{enunciado:'O que é o Sol?',opcoes:['Um planeta','Uma lua','Uma estrela','Um asteroide'],correta:2},{enunciado:'Qual planeta fica mais próximo do Sol?',opcoes:['Vênus','Terra','Mercúrio','Marte'],correta:2}]},
];

let atividadeAtual=null,questaoAtual=0,acertos=0,respondida=false;
const coresDificuldade={facil:'text-sucesso bg-green-50',medio:'text-aviso bg-orange-50',dificil:'text-erro bg-red-50'};
const labelDificuldade={facil:'Fácil',medio:'Médio',dificil:'Difícil'};
const labelSerie={'5ano':'5º Ano','6ano':'6º Ano','7ano':'7º Ano','8ano':'8º Ano','9ano':'9º Ano'};

function renderizarCards(lista){
  const c=document.getElementById('listaAtividades'),s=document.getElementById('semResultados'),cnt=document.getElementById('contadorResultados');
  c.innerHTML='';cnt.textContent=`${lista.length} atividade${lista.length!==1?'s':''} encontrada${lista.length!==1?'s':''}`;
  if(lista.length===0){s.classList.remove('hidden');return;}s.classList.add('hidden');
  lista.forEach((a,i)=>{const card=document.createElement('div');card.className='bg-white rounded-2xl overflow-hidden conteudo-sombra botao-efeito anim';card.style.animationDelay=`${i*0.06}s`;card.innerHTML=`<div class="h-2" style="background:${a.cor}"></div><div class="p-5"><div class="flex justify-between items-start mb-3 gap-2"><h3 class="text-base font-black leading-tight">${a.titulo}</h3><span class="px-2.5 py-1 rounded-full text-xs font-bold flex-shrink-0" style="background:${a.cor}22;color:${a.cor}">${a.materiaLabel}</span></div><p class="text-gray-500 text-sm mb-4 leading-relaxed">${a.descricao}</p><div class="flex flex-wrap gap-3 mb-5 text-xs text-gray-500 font-semibold"><span><i class="fa fa-graduation-cap mr-1"></i>${labelSerie[a.serie]||a.serie}</span><span class="px-2 py-0.5 rounded-full text-xs font-bold ${coresDificuldade[a.dificuldade]}">${labelDificuldade[a.dificuldade]}</span><span><i class="fa fa-list mr-1"></i>${a.questoes.length} questões</span></div><button onclick="abrirAtividade(${a.id})" class="w-full py-2.5 px-4 rounded-xl font-bold text-sm text-white botao-efeito" style="background:${a.cor}"><i class="fa fa-play mr-1"></i> Começar Atividade</button></div>`;c.appendChild(card);});
}

function filtrarAtividades(){
  const mat=document.getElementById('filtroMateria').value,ser=document.getElementById('filtroSerie').value,dif=document.getElementById('filtroDificuldade').value;
  renderizarCards(atividades.filter(a=>(!mat||a.materia===mat)&&(!ser||a.serie===ser)&&(!dif||a.dificuldade===dif)));
}

function abrirAtividade(id){atividadeAtual=atividades.find(a=>a.id===id);questaoAtual=0;acertos=0;respondida=false;document.getElementById('modalAtividade').classList.remove('hidden');document.body.style.overflow='hidden';renderizarQuestao();}
function fecharModal(){document.getElementById('modalAtividade').classList.add('hidden');document.body.style.overflow='';}
function fecharTudo(){fecharModal();document.getElementById('modalResultado').classList.add('hidden');document.body.style.overflow='';}

function renderizarQuestao(){
  const q=atividadeAtual.questoes[questaoAtual],total=atividadeAtual.questoes.length,prog=(questaoAtual/total)*100;
  document.getElementById('modalHeader').style.background=`linear-gradient(135deg,${atividadeAtual.cor},${atividadeAtual.cor}cc)`;
  document.getElementById('modalMateria').textContent=atividadeAtual.materiaLabel;
  document.getElementById('modalTitulo').textContent=atividadeAtual.titulo;
  document.getElementById('modalInfo').textContent=`${labelDificuldade[atividadeAtual.dificuldade]} · ${labelSerie[atividadeAtual.serie]}`;
  document.getElementById('barraProgresso').style.width=prog+'%';
  document.getElementById('progressoTexto').textContent=`Questão ${questaoAtual+1} de ${total}`;
  document.getElementById('enunciadoQuestao').textContent=q.enunciado;
  const letras=['A','B','C','D'],el=document.getElementById('opcoesQuestao');el.innerHTML='';
  q.opcoes.forEach((op,i)=>{const btn=document.createElement('button');btn.className='opcao-questao w-full text-left';btn.innerHTML=`<span class="letra-opcao">${letras[i]}</span>${op}`;btn.onclick=()=>responder(i,btn);el.appendChild(btn);});
  document.getElementById('feedbackQuestao').classList.add('hidden');document.getElementById('btnProximo').classList.add('hidden');
  document.getElementById('placarModal').textContent=`✅ ${acertos} acerto${acertos!==1?'s':''}`;respondida=false;
}

function responder(indice,btnClicado){
  if(respondida)return;respondida=true;
  const q=atividadeAtual.questoes[questaoAtual],opcoes=document.querySelectorAll('.opcao-questao'),feedback=document.getElementById('feedbackQuestao');
  opcoes.forEach(b=>b.style.pointerEvents='none');
  if(indice===q.correta){acertos++;btnClicado.classList.add('correta');feedback.className='mt-4 p-4 rounded-xl text-sm font-semibold bg-green-50 text-sucesso border border-green-200';feedback.textContent='✅ Correto! Muito bem!';}
  else{btnClicado.classList.add('errada');opcoes[q.correta].classList.add('correta');feedback.className='mt-4 p-4 rounded-xl text-sm font-semibold bg-red-50 text-erro border border-red-200';feedback.textContent=`❌ Incorreto. A resposta certa é: ${q.opcoes[q.correta]}`;}
  feedback.classList.remove('hidden');document.getElementById('placarModal').textContent=`✅ ${acertos} acerto${acertos!==1?'s':''}`;
  const btnProx=document.getElementById('btnProximo');btnProx.classList.remove('hidden');
  btnProx.innerHTML=questaoAtual===atividadeAtual.questoes.length-1?'Ver Resultado <i class="fa fa-trophy ml-1"></i>':'Próxima <i class="fa fa-arrow-right ml-1"></i>';
}

function proximaQuestao(){questaoAtual++;if(questaoAtual>=atividadeAtual.questoes.length)mostrarResultado();else renderizarQuestao();}

function mostrarResultado(){
  fecharModal();const total=atividadeAtual.questoes.length,pct=Math.round((acertos/total)*100);
  let icone,titulo,sub;
  if(pct>=80){icone='🏆';titulo=`Excelente! ${pct}%`;sub=`Você acertou ${acertos} de ${total} questões. Parabéns!`;}
  else if(pct>=50){icone='👍';titulo=`Bom trabalho! ${pct}%`;sub=`Você acertou ${acertos} de ${total} questões. Continue praticando!`;}
  else{icone='📚';titulo=`Pode melhorar! ${pct}%`;sub=`Você acertou ${acertos} de ${total} questões. Revise o conteúdo e tente novamente!`;}
  document.getElementById('iconResultado').textContent=icone;document.getElementById('tituloResultado').textContent=titulo;document.getElementById('subtituloResultado').textContent=sub;
  document.getElementById('modalResultado').classList.remove('hidden');document.body.style.overflow='hidden';
}

function reiniciarAtividade(){document.getElementById('modalResultado').classList.add('hidden');abrirAtividade(atividadeAtual.id);}

window.onload = function() {
  const u = verificarAcesso();
  if (!u) return;
  preencherNome();
  const params = new URLSearchParams(window.location.search);
  const materiaParam = params.get('materia');
  if (materiaParam) document.getElementById('filtroMateria').value = materiaParam;
  filtrarAtividades();
};
</script>
